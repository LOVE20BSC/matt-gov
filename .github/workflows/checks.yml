name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LOVE20BSC/core
          path: core
      - uses: actions/checkout@v4
        with:
          repository: LOVE20BSC/action
          path: action
      - uses: actions/checkout@v4
        with:
          repository: LOVE20BSC/group-chat
          path: group-chat
      - uses: actions/checkout@v4
        with:
          repository: LOVE20BSC/libs
          path: libs
      - uses: actions/checkout@v4
        with:
          path: matt-gov
      # check_errors.py resolves selectors with `cast`, so the toolchain has to be
      # installed even though no Solidity is compiled here.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1
      # The checkers resolve the workspace root from their own location, so they
      # need the four sibling repos checked out next to matt-gov.
      - run: python3 matt-gov/script/check_doc_payloads.py
      - run: python3 matt-gov/script/check_naming.py
      - run: bash matt-gov/script/check_caller_auth.sh
      - run: python3 matt-gov/script/check_error_tests.py
      - run: python3 matt-gov/script/check_errors.py --check
